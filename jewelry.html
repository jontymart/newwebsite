<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fashion Jewelry – JontyMart</title>
  <meta name="description" content="Explore premium fashion jewelry like necklaces, rings, anklets and earrings from Indian manufacturers.">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🔁 Header Include -->
  <div id="header"></div>

  <!-- 🔁 Main Section -->
  <div class="main-container">

    <!-- 🔁 Sidebar Include -->
    <div id="sidebar"></div>

    <!-- ✅ Jewelry Products Section -->
    <div class="products-container">
      <h1 style="margin-bottom: 20px;">Fashion Jewelry Collection</h1>
      <div class="products-grid">

        <a href="neck-chains.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="neck-chains.png" alt="Neck Chains">
            </div>
            <div class="label">Neck Chains</div>
          </div>
        </a>

        <a href="bracelets.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="bracelets.png" alt="Bracelets">
            </div>
            <div class="label">Bracelets</div>
          </div>
        </a>

        <a href="pendant-necklaces.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="pendant-necklaces.png" alt="Pendant Necklaces">
            </div>
            <div class="label">Pendant Necklaces</div>
          </div>
        </a>

        <a href="rings.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="rings.png" alt="Rings">
            </div>
            <div class="label">Rings</div>
          </div>
        </a>

        <a href="finger-rings.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="finger-rings.png" alt="Finger Rings">
            </div>
            <div class="label">Finger Rings</div>
          </div>
        </a>

        <a href="earrings-studs.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="earrings-studs.png" alt="Earrings (Studs)">
            </div>
            <div class="label">Earrings (Studs)</div>
          </div>
        </a>

        <a href="dog-tags.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="dog-tags.png" alt="Dog Tags">
            </div>
            <div class="label">Dog Tags</div>
          </div>
        </a>

        <a href="anklets.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="anklets.png" alt="Anklets">
            </div>
            <div class="label">Anklets</div>
          </div>
        </a>

        <a href="nose-rings.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="nose-rings.png" alt="Nose Rings (Septum Rings)">
            </div>
            <div class="label">Nose Rings (Septum Rings)</div>
          </div>
        </a>

      </div>
    </div>
  </div>

  <!-- 🔁 Footer Include -->
  <div id="footer"></div>

  <!-- 🔁 Script to Load Components -->
  <script src="script.js"></script>
</body>
</html>
