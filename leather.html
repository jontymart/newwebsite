<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leather Products - JontyMart</title>
  <meta name="description" content="Explore leather & leatherette goods like raw leather, rexine, bags, wallets & belts. Quality Indian export products by JontyMart.">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🔁 Header Include -->
  <div id="header"></div>

  <!-- 🔁 Main Content -->
  <div class="main-container">

    <!-- 🔁 Sidebar Include -->
    <div id="sidebar"></div>

    <!-- 🔷 Page-Specific Products -->
    <div class="products-container">
      <h1 style="margin-bottom: 20px;">Premium Leather Collection</h1>
      <div class="products-grid">

        <!-- 1. Raw Leather -->
        <a href="raw-leather.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="raw-leather.png" alt="Raw Leather" />
            </div>
            <div class="label">Raw Leather</div>
          </div>
        </a>

        <!-- 2. Rexine Artificial Leather -->
        <a href="rexine.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="rexine.png" alt="Rexine Artificial Leather" />
            </div>
            <div class="label">Rexine (Artificial Leather)</div>
          </div>
        </a>

        <!-- 3. Premium Handbags -->
        <a href="premium-handbags.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="premium-handbags.png" alt="Premium Handbags" />
            </div>
            <div class="label">Premium Handbags</div>
          </div>
        </a>

        <!-- 4. Leather Bags -->
        <a href="leather-bags.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="leather-bags.png" alt="Leather Bags" />
            </div>
            <div class="label">Leather Bags</div>
          </div>
        </a>

        <!-- 5. Leather Wallet -->
        <a href="leather-wallet.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="leather-wallet.png" alt="Leather Wallet" />
            </div>
            <div class="label">Leather Wallet</div>
          </div>
        </a>

        <!-- 6. Leather Belt -->
        <a href="leather-belt.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="leather-belt.png" alt="Leather Belt" />
            </div>
            <div class="label">Leather Belt</div>
          </div>
        </a>

      </div>
    </div>
  </div>

  <!-- 🔁 Footer Include -->
  <div id="footer"></div>

  <!-- ✅ JavaScript -->
  <script src="script.js"></script>
</body>
</html>
