<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jute Bags – JontyMart</title>
  <meta name="description" content="Explore eco-friendly jute bags – printed, plain, and shopping styles. Made in India. Export quality.">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🔁 Header Include -->
  <div id="header"></div>

  <div class="main-container">

    <!-- 🔁 Sidebar Include -->
    <div id="sidebar"></div>

    <!-- 🧾 Jute Bags Cards -->
    <div class="products-container">
      <h1 style="margin-bottom: 20px;">Jute Bags</h1>
      <div class="products-grid">

        <a href="plain-jute-bag.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="plain-jute-bag.png" alt="Plain Jute Bag" />
            </div>
            <div class="label">Plain Jute Bag</div>
          </div>
        </a>

        <a href="printed-jute-bag.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="printed-jute-bag.png" alt="Printed Jute Bag" />
            </div>
            <div class="label">Printed Jute Bag</div>
          </div>
        </a>

        <a href="eco-jute-shopping-bag.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="eco-jute-shopping-bag.png" alt="Eco Jute Shopping Bag" />
            </div>
            <div class="label">Eco Jute Shopping Bag</div>
          </div>
        </a>

      </div>
    </div>
  </div>

  <!-- 🔁 Footer Include -->
  <div id="footer"></div>

  <!-- ✅ Script for loading components -->
  <script src="script.js"></script>
</body>
</html>
