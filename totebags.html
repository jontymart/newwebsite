<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tote Bags – JontyMart</title>
  <meta name="description" content="Eco-friendly, stylish, export-quality tote bags. Reusable, canvas, custom printed totes by JontyMart.">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🔁 Add Header -->
  <div id="header"></div>

  <div class="main-container">
    
    <!-- 🔁 Add Sidebar -->
    <div id="sidebar"></div>

    <!-- 🧾 Tote Bags Products -->
    <div class="products-container">
      <h1 style="margin-bottom: 20px;">Tote Bags</h1>
      <div class="products-grid">

        <a href="canvas-tote-bag.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="canvas-tote-bag.png" alt="Canvas Tote Bag" />
            </div>
            <div class="label">Canvas Tote Bag</div>
          </div>
        </a>

        <a href="eco-friendly-tote.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="eco-friendly-tote.png" alt="Eco-friendly Tote" />
            </div>
            <div class="label">Eco-friendly Tote</div>
          </div>
        </a>

        <a href="travel-tote.html" class="card-link">
          <div class="card">
            <div class="card-img-container">
              <img src="travel-tote.png" alt="Travel Tote" />
            </div>
            <div class="label">Travel Tote</div>
          </div>
        </a>

      </div>
    </div>
  </div>

  <!-- 🔁 Add Footer -->
  <div id="footer"></div>

  <!-- 🔧 JavaScript Loader -->
  <script src="script.js"></script>
</body>
</html>
